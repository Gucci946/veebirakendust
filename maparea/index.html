<script>
    const image = document.getElementById("arvutipilt");
    const areas = document.querySelectorAll(
        'map[name="arvutikaart"] area'
    );

    function scaleImageMap() {
        if (!image.complete || image.naturalWidth === 0) {
            return;
        }

        const scaleX = image.clientWidth / image.naturalWidth;
        const scaleY = image.clientHeight / image.naturalHeight;

        areas.forEach(function (area) {
            const originalCoords = area.dataset.originalCoords
                .split(",")
                .map(Number);

            const scaledCoords = originalCoords.map(function (value, index) {
                return Math.round(
                    value * (index % 2 === 0 ? scaleX : scaleY)
                );
            });

            area.coords = scaledCoords.join(",");
        });
    }

    image.addEventListener("load", scaleImageMap);
    window.addEventListener("resize", scaleImageMap);

    if (image.complete) {
        scaleImageMap();
    }
</script>
