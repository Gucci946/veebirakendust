<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Spordi küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
    <script src="../js/kysimustikScript.js"></script>
</head>
<body>
<h1>Spordi küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <!-- c + tab komentaar -->
    <table border="1">
        <tr>
            <td>
                <!-- Tekstkast -->
                <label for="nimi">Nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Ronaldo" oninput="nimiLugemineKastist()">
            </td>
            <td>
                <div id="vastus1"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- ripploend või rippmenüü -->
                <label for="stiil">Vali meeldivaim sport:</label>
            </td>
            <td>
                <select name="stiil" id="stiil" onchange="selectValik()">
                    <option value="vali">vali..</option>
                    <option value="hiphop">karate</option>
                    <option value="kantri">jalgpall</option>
                    <option value="rock">võrkpall</option>
                    <option value="metal">korvpall</option>
                    <option value="jazz">hokki</option>
                </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- radio nupud -üks valik mitmest -->
                <strong>
                    Mis jõusaalis sa käid?
                </strong>
            </td>
            <td>
                <input type="jõusaalis" name="saal" id="gym" value="gym" onclick="radioValik()">
                <label for="gym">Gym</label>
                <br>
                <input type="jõusaalis" name="saal" id="my fitness" value="my fitness" onclick="radioValik()">
                <label for="my fitness">My fitness</label>
                <br>
                <input type="jõusaalis" name="saal" id="lemon gym" value="lemon gym" onclick="radioValik()">
                <label for="lemon gym">lemon gym</label>
            </td>
            <td>
                <div id="vastus2"></div>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <!-- checkbox - markerruut -->
                <fieldset>
                    <legend>Tee oma valikud - lemmik ansambel</legend>
                    <input type="checkbox" name="lemmikud" id="rollingstones" value="Rolling Stones" onchange="checkboxValik()">
                    <label for="rollingstones">Rolling stones</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="systemofdown" value="System of Down" onchange="checkboxValik()">
                    <label for="systemofdown">System of Down</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="metallica" value="Metallica" onchange="checkboxValik()">
                    <label for="metallica">Metallica</label>
                    <br>
                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- range - vahemik -->
                <label for="tund">
                    Mitu tundi päevas sa kuulad muusikat?
                </label>
            </td>
            <td>
                0<input type="range" id="tund" min="0" max="24" onchange="rangeValik()">24
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <tr>
            <td> Input type=color, file, email, jne kokku 5-6tk</td>
            <td>w3schools.com</td>
        </tr>
        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="puhasta()">
            </td>
            <td>
                <input type="button" value="Näita/Loe andmed" onclick="naitaKoike()">
            </td>
            <td>
                <div id="vastusKoik"></div>
            </td>
        </tr>

    </table>




</form>
</body>
</html>
