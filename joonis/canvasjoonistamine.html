
<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Joonistamine</title>
    <link rel="stylesheet" href="canvacss.css">
    <script src="canvajs.js" defer></script>
</head>
<body>

<h1>Joonistusrakendus Canvas + JS</h1>

<canvas id="canvas" width="400" height="400"></canvas>

<table>
    <tr>
        <td>
            <input type="button" value="Puhasta" onclick="puhasta()">
        </td>
    </tr>

    <tr>
        <td>
            <input type="button" value="Joon" onclick="joon()">
        </td>
    </tr>

    <tr>
        <td>
            <input type="button" value="Kolmnurk" onclick="kolmnurk()">
        </td>
    </tr>

    <tr>
        <td>
            <label for="laius">Laius:</label>
            <input type="number" id="laius" value="100" min="1">

            <label for="korgus">Kõrgus:</label>
            <input type="number" id="korgus" value="80" min="1">

            <input type="button" value="Ristkülik" onclick="ristylik()">
        </td>
    </tr>

    <tr>
        <td>
            <label for="raadius">Raadius:</label>
            <input type="number" id="raadius" value="30" min="1" max="100">
            <input type="button" value="Ring" onclick="ring()">
        </td>
    </tr>

    <tr>
        <td>
            <input type="button" value="Juhuslik pilt" onclick="pilt()">
        </td>
    </tr>
</table>

</body>
</html>
